<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="410" rx="26"/></clipPath><rect width="1440" height="410" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="41" r="184" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="184" r="172" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="418" r="164" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="410" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="408.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">From <tspan fill="#6ee7b7">apt install</tspan> to a protected server</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">The wizard runs once on https://&lt;server&gt;:9443, unlocked with a one-time token, and closes for good when you finish.</text><g filter="url(#shadow)"><rect x="48" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".45"/></g><rect x="66" y="140" width="170" height="4" rx="2" fill="url(#g-sky)"/><text x="68" y="174" font-size="17" font-weight="800" fill="#fff">Checks</text><circle cx="218" cy="170" r="17" fill="#7dd3fc" fill-opacity=".15" stroke="#7dd3fc"/><text x="218" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#7dd3fc">1</text><text x="68" y="224" font-size="12.5" fill="#cbd5e1">• OS</text><text x="68" y="246" font-size="12.5" fill="#cbd5e1">• Docker</text><text x="68" y="268" font-size="12.5" fill="#cbd5e1">• mailcow</text><text x="68" y="290" font-size="12.5" fill="#cbd5e1">• ports</text><text x="68" y="312" font-size="12.5" fill="#cbd5e1">• clock</text><path d="M256 225 H272" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-sky)"/><g filter="url(#shadow)"><rect x="274" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#a5b4fc" stroke-opacity=".45"/></g><rect x="292" y="140" width="170" height="4" rx="2" fill="url(#g-indigo)"/><text x="294" y="174" font-size="17" font-weight="800" fill="#fff">Protection</text><circle cx="444" cy="170" r="17" fill="#a5b4fc" fill-opacity=".15" stroke="#a5b4fc"/><text x="444" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#a5b4fc">2</text><text x="294" y="224" font-size="12.5" fill="#cbd5e1">• edge + WAF</text><text x="294" y="246" font-size="12.5" fill="#cbd5e1">• LAN-only admin</text><text x="294" y="268" font-size="12.5" fill="#cbd5e1">• ban policy</text><path d="M482 225 H498" fill="none" stroke="#a5b4fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-indigo)"/><g filter="url(#shadow)"><rect x="500" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="518" y="140" width="170" height="4" rx="2" fill="url(#g-emerald)"/><text x="520" y="174" font-size="17" font-weight="800" fill="#fff">Certificates</text><circle cx="670" cy="170" r="17" fill="#6ee7b7" fill-opacity=".15" stroke="#6ee7b7"/><text x="670" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#6ee7b7">3</text><text x="520" y="224" font-size="12.5" fill="#cbd5e1">• DNS-01</text><text x="520" y="246" font-size="12.5" fill="#cbd5e1">• per-domain</text><text x="520" y="268" font-size="12.5" fill="#cbd5e1">• wildcard</text><path d="M708 225 H724" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-emerald)"/><g filter="url(#shadow)"><rect x="726" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="744" y="140" width="170" height="4" rx="2" fill="url(#g-amber)"/><text x="746" y="174" font-size="17" font-weight="800" fill="#fff">Access</text><circle cx="896" cy="170" r="17" fill="#fcd34d" fill-opacity=".15" stroke="#fcd34d"/><text x="896" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#fcd34d">4</text><text x="746" y="224" font-size="12.5" fill="#cbd5e1">• LAN</text><text x="746" y="246" font-size="12.5" fill="#cbd5e1">• Tunnel</text><text x="746" y="268" font-size="12.5" fill="#cbd5e1">• Internet</text><text x="746" y="290" font-size="12.5" fill="#cbd5e1">• SSH</text><path d="M934 225 H950" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-amber)"/><g filter="url(#shadow)"><rect x="952" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#c4b5fd" stroke-opacity=".45"/></g><rect x="970" y="140" width="170" height="4" rx="2" fill="url(#g-violet)"/><text x="972" y="174" font-size="17" font-weight="800" fill="#fff">Account</text><circle cx="1122" cy="170" r="17" fill="#c4b5fd" fill-opacity=".15" stroke="#c4b5fd"/><text x="1122" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#c4b5fd">5</text><text x="972" y="224" font-size="12.5" fill="#cbd5e1">• local admin</text><text x="972" y="246" font-size="12.5" fill="#cbd5e1">• 2FA at first sign-in</text><path d="M1160 225 H1176" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-violet)"/><g filter="url(#shadow)"><rect x="1178" y="140" width="206" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fb7185" stroke-opacity=".45"/></g><rect x="1196" y="140" width="170" height="4" rx="2" fill="url(#g-rose)"/><text x="1198" y="174" font-size="17" font-weight="800" fill="#fff">Install</text><circle cx="1348" cy="170" r="17" fill="#fb7185" fill-opacity=".15" stroke="#fb7185"/><text x="1348" y="175" font-size="15" font-weight="800" text-anchor="middle" fill="#fb7185">6</text><text x="1198" y="224" font-size="12.5" fill="#cbd5e1">• live steps</text><text x="1198" y="246" font-size="12.5" fill="#cbd5e1">• backups</text><text x="1198" y="268" font-size="12.5" fill="#cbd5e1">• auto-rollback</text><text x="48" y="380" font-size="12.5" fill="#64748b">Prefer the terminal? <tspan font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" fill="#a5b4fc">sudo cowsec-setup install --config cowsec.json</tspan> runs the same steps.</text></svg>
