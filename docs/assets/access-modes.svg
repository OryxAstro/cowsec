<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="560" rx="26"/></clipPath><rect width="1440" height="560" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="56" r="252" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="252" r="235" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="571" r="224" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="560" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="558.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">Four ways to reach the console</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">The console always listens on 127.0.0.1:8090. The access mode decides what, if anything, publishes it.</text><g filter="url(#shadow)"><rect x="48" y="130" width="318" height="380" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="66" y="130" width="282" height="4" rx="2" fill="url(#g-emerald)"/><text x="68" y="164" font-size="17" font-weight="800" fill="#fff">Local network</text><text x="68" y="183" font-size="11.5" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">LAN only</text><rect x="68" y="230" width="278" height="46" rx="12" fill="#6ee7b7" fill-opacity=".08" stroke="#6ee7b7" stroke-opacity=".35"/><text x="207" y="258" font-size="13" fill="#e2e8f0" text-anchor="middle">your browser on the LAN</text><path d="M207 277 V296" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-emerald)"/><rect x="68" y="300" width="278" height="46" rx="12" fill="#6ee7b7" fill-opacity=".08" stroke="#6ee7b7" stroke-opacity=".35"/><text x="207" y="328" font-size="13" fill="#e2e8f0" text-anchor="middle">OpenResty :443 · allow LAN ranges</text><path d="M207 347 V366" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-emerald)"/><rect x="68" y="370" width="278" height="46" rx="12" fill="#6ee7b7" fill-opacity=".08" stroke="#6ee7b7" stroke-opacity=".35"/><text x="207" y="398" font-size="13" fill="#e2e8f0" text-anchor="middle">everyone else: 403</text><text x="207" y="490" font-size="12.5" fill="#6ee7b7" font-weight="700" text-anchor="middle">Most homes and offices</text><g filter="url(#shadow)"><rect x="388" y="130" width="318" height="380" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="406" y="130" width="282" height="4" rx="2" fill="url(#g-amber)"/><text x="408" y="164" font-size="17" font-weight="800" fill="#fff">Cloudflare Tunnel</text><text x="408" y="183" font-size="11.5" fill="#fcd34d" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">no open ports</text><rect x="408" y="230" width="278" height="46" rx="12" fill="#fcd34d" fill-opacity=".08" stroke="#fcd34d" stroke-opacity=".35"/><text x="547" y="258" font-size="13" fill="#e2e8f0" text-anchor="middle">your browser anywhere</text><path d="M547 277 V296" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-amber)"/><rect x="408" y="300" width="278" height="46" rx="12" fill="#fcd34d" fill-opacity=".08" stroke="#fcd34d" stroke-opacity=".35"/><text x="547" y="328" font-size="13" fill="#e2e8f0" text-anchor="middle">Cloudflare Access login</text><path d="M547 347 V366" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-amber)"/><rect x="408" y="370" width="278" height="46" rx="12" fill="#fcd34d" fill-opacity=".08" stroke="#fcd34d" stroke-opacity=".35"/><text x="547" y="398" font-size="13" fill="#e2e8f0" text-anchor="middle">cloudflared dials out</text><text x="547" y="490" font-size="12.5" fill="#fcd34d" font-weight="700" text-anchor="middle">Remote access, safest</text><g filter="url(#shadow)"><rect x="728" y="130" width="318" height="380" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fb7185" stroke-opacity=".45"/></g><rect x="746" y="130" width="282" height="4" rx="2" fill="url(#g-rose)"/><text x="748" y="164" font-size="17" font-weight="800" fill="#fff">Internet</text><text x="748" y="183" font-size="11.5" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">public sign-in page</text><rect x="748" y="230" width="278" height="46" rx="12" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".35"/><text x="887" y="258" font-size="13" fill="#e2e8f0" text-anchor="middle">anyone</text><path d="M887 277 V296" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-rose)"/><rect x="748" y="300" width="278" height="46" rx="12" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".35"/><text x="887" y="328" font-size="13" fill="#e2e8f0" text-anchor="middle">CrowdSec + WAF + rate limits</text><path d="M887 347 V366" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-rose)"/><rect x="748" y="370" width="278" height="46" rx="12" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".35"/><text x="887" y="398" font-size="13" fill="#e2e8f0" text-anchor="middle">password + 2FA</text><text x="887" y="490" font-size="12.5" fill="#fb7185" font-weight="700" text-anchor="middle">When a tunnel isn't possible</text><g filter="url(#shadow)"><rect x="1068" y="130" width="318" height="380" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".45"/></g><rect x="1086" y="130" width="282" height="4" rx="2" fill="url(#g-sky)"/><text x="1088" y="164" font-size="17" font-weight="800" fill="#fff">This server only</text><text x="1088" y="183" font-size="11.5" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">nothing exposed</text><rect x="1088" y="230" width="278" height="46" rx="12" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1227" y="258" font-size="13" fill="#e2e8f0" text-anchor="middle">ssh -L 8090:127.0.0.1:8090</text><path d="M1227 277 V296" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-sky)"/><rect x="1088" y="300" width="278" height="46" rx="12" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1227" y="328" font-size="13" fill="#e2e8f0" text-anchor="middle">your laptop: localhost:8090</text><path d="M1227 347 V366" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-sky)"/><rect x="1088" y="370" width="278" height="46" rx="12" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1227" y="398" font-size="13" fill="#e2e8f0" text-anchor="middle">zero network exposure</text><text x="1227" y="490" font-size="12.5" fill="#7dd3fc" font-weight="700" text-anchor="middle">Maximum lock-down</text><text x="48" y="540" font-size="12.5" fill="#64748b">Switch any time: <tspan font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" fill="#a5b4fc">sudo cowsec-setup access lan|tunnel|wan|local</tspan></text></svg>
