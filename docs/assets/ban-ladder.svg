<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1280" height="420" rx="26"/></clipPath><rect width="1280" height="420" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="153" cy="42" r="189" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1177" cy="189" r="176" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="512" cy="428" r="168" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1280" height="420" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1278.5" height="418.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">Escalating bans</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">Each ban looks back 7 days. Repeat offenders from abroad climb the ladder; home-country IPs stay on the first rung.</text><rect x="60" y="290" width="150" height="40" rx="12" fill="#10b981" fill-opacity=".22" stroke="#10b981"/><text x="135" y="320" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">4h</text><text x="135" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">1st ban</text><rect x="232" y="260" width="150" height="70" rx="12" fill="#36a47b" fill-opacity=".22" stroke="#36a47b"/><text x="307" y="290" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">8h</text><text x="307" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">2nd ban</text><rect x="404" y="230" width="150" height="100" rx="12" fill="#5c9075" fill-opacity=".22" stroke="#5c9075"/><text x="479" y="260" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">16h</text><text x="479" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">3rd ban</text><rect x="576" y="200" width="150" height="130" rx="12" fill="#827c6f" fill-opacity=".22" stroke="#827c6f"/><text x="651" y="230" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">32h</text><text x="651" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">4th ban</text><rect x="748" y="170" width="150" height="160" rx="12" fill="#a86769" fill-opacity=".22" stroke="#a86769"/><text x="823" y="200" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">64h</text><text x="823" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">5th ban</text><rect x="920" y="140" width="150" height="190" rx="12" fill="#ce5363" fill-opacity=".22" stroke="#ce5363"/><text x="995" y="170" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">128h</text><text x="995" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">6th ban</text><rect x="1092" y="110" width="150" height="220" rx="12" fill="#f43f5e" fill-opacity=".22" stroke="#f43f5e"/><text x="1167" y="140" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">7 days</text><text x="1167" y="354" font-size="12" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">7th+ ban</text><text x="48" y="396" font-size="12.5" fill="#64748b">Double or linear steps, first ban and cap are configurable in Herd Rules. Burst alerts from one attack count once.</text></svg>
