<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="620" rx="26"/></clipPath><rect width="1440" height="620" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="62" r="279" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="279" r="260" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="632" r="248" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="620" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="618.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">Layers between a browser and your server</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">Each layer has to be passed in order. Secrets stay in root-only files and never reach the browser or the logs.</text><g filter="url(#shadow)"><rect x="48" y="128" width="860" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#fb7185" stroke-opacity=".5"/></g><rect x="66" y="140" width="5" height="38" rx="2.5" fill="url(#g-rose)"/><text x="86" y="156" font-size="16" font-weight="800" fill="#fff">Network</text><text x="86" y="176" font-size="12.5" fill="#94a3b8">access mode · firewall bouncer · edge bouncer · AppSec WAF</text><g filter="url(#shadow)"><rect x="74" y="204" width="808" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".5"/></g><rect x="92" y="216" width="5" height="38" rx="2.5" fill="url(#g-sky)"/><text x="112" y="232" font-size="16" font-weight="800" fill="#fff">TLS</text><text x="112" y="252" font-size="12.5" fill="#94a3b8">HTTPS for every connection that leaves the server · modern TLS only</text><g filter="url(#shadow)"><rect x="100" y="280" width="756" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#a5b4fc" stroke-opacity=".5"/></g><rect x="118" y="292" width="5" height="38" rx="2.5" fill="url(#g-indigo)"/><text x="138" y="308" font-size="16" font-weight="800" fill="#fff">Sign-in</text><text x="138" y="328" font-size="12.5" fill="#94a3b8">local account or LDAP · rate limits per IP and per user · audit log</text><g filter="url(#shadow)"><rect x="126" y="356" width="704" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#c4b5fd" stroke-opacity=".5"/></g><rect x="144" y="368" width="5" height="38" rx="2.5" fill="url(#g-violet)"/><text x="164" y="384" font-size="16" font-weight="800" fill="#fff">Second factor</text><text x="164" y="404" font-size="12.5" fill="#94a3b8">TOTP with replay protection, or Duo Push · always required</text><g filter="url(#shadow)"><rect x="152" y="432" width="652" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".5"/></g><rect x="170" y="444" width="5" height="38" rx="2.5" fill="url(#g-amber)"/><text x="190" y="460" font-size="16" font-weight="800" fill="#fff">Session</text><text x="190" y="480" font-size="12.5" fill="#94a3b8">HttpOnly + SameSite=Strict cookie · idle and absolute timeouts · CSRF header</text><g filter="url(#shadow)"><rect x="178" y="508" width="600" height="62" rx="16" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".5"/></g><rect x="196" y="520" width="5" height="38" rx="2.5" fill="url(#g-emerald)"/><text x="216" y="536" font-size="16" font-weight="800" fill="#fff">Privileged work</text><text x="216" y="556" font-size="12.5" fill="#94a3b8">cowsec-hostctl: a fixed allowlist of verbs · jobs in transient systemd units</text><g filter="url(#shadow)"><rect x="960" y="128" width="432" height="280" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="978" y="128" width="396" height="4" rx="2" fill="url(#g-amber)"/><text x="980" y="162" font-size="17" font-weight="800" fill="#fff">Secrets vault</text><text x="980" y="181" font-size="11.5" fill="#fcd34d" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">root-only, mode 0600</text><circle cx="984" cy="200" r="3.2" fill="#fcd34d"/><text x="996" y="204" font-size="13" fill="#e2e8f0" font-weight="600">/etc/cowsec/cowsec.env</text><text x="996" y="220" font-size="11" fill="#94a3b8">LDAP bind, Duo keys</text><circle cx="984" cy="238" r="3.2" fill="#fcd34d"/><text x="996" y="242" font-size="13" fill="#e2e8f0" font-weight="600">/etc/cowsec/dns.env</text><text x="996" y="258" font-size="11" fill="#94a3b8">DNS provider credentials</text><circle cx="984" cy="276" r="3.2" fill="#fcd34d"/><text x="996" y="280" font-size="13" fill="#e2e8f0" font-weight="600">/etc/cowsec/mailcow.env</text><text x="996" y="296" font-size="11" fill="#94a3b8">mailcow API key</text><circle cx="984" cy="314" r="3.2" fill="#fcd34d"/><text x="996" y="318" font-size="13" fill="#e2e8f0" font-weight="600">/var/lib/cowsec/</text><text x="996" y="334" font-size="11" fill="#94a3b8">accounts, TOTP, sessions, certificates</text><g filter="url(#shadow)"><rect x="960" y="430" width="432" height="160" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="978" y="430" width="396" height="4" rx="2" fill="url(#g-emerald)"/><text x="980" y="464" font-size="17" font-weight="800" fill="#fff">Nothing phones home</text><text x="980" y="483" font-size="11.5" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">no telemetry</text><circle cx="984" cy="502" r="3.2" fill="#6ee7b7"/><text x="996" y="506" font-size="13" fill="#e2e8f0" font-weight="600">GeoIP and fonts are local</text><circle cx="984" cy="526" r="3.2" fill="#6ee7b7"/><text x="996" y="530" font-size="13" fill="#e2e8f0" font-weight="600">Downloads: signed repos, pinned hashes</text></svg>
