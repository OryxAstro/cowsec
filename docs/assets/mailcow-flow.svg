<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="470" rx="26"/></clipPath><rect width="1440" height="470" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="47" r="211" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="211" r="197" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="479" r="188" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="470" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="468.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">Managing mailcow without its admin UI</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">CowSec calls mailcow&apos;s own API on localhost. Only validated operations are exposed, and every change lands in CowSec&apos;s audit log.</text><g filter="url(#shadow)"><rect x="48" y="130" width="330" height="290" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="66" y="130" width="294" height="4" rx="2" fill="url(#g-amber)"/><text x="68" y="164" font-size="17" font-weight="800" fill="#fff">You, in CowSec</text><text x="68" y="183" font-size="11.5" fill="#fcd34d" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">2FA sign-in</text><circle cx="72" cy="202" r="3.2" fill="#fcd34d"/><text x="84" y="206" font-size="13" fill="#e2e8f0" font-weight="600">Farmhouse</text><text x="84" y="222" font-size="11" fill="#94a3b8">containers · versions · storage</text><circle cx="72" cy="240" r="3.2" fill="#fcd34d"/><text x="84" y="244" font-size="13" fill="#e2e8f0" font-weight="600">Paddocks · Stalls · Ear Tags</text><text x="84" y="260" font-size="11" fill="#94a3b8">domains · mailboxes · aliases</text><circle cx="72" cy="278" r="3.2" fill="#fcd34d"/><text x="84" y="282" font-size="13" fill="#e2e8f0" font-weight="600">Brand Irons</text><text x="84" y="298" font-size="11" fill="#94a3b8">DKIM keys + DNS records</text><circle cx="72" cy="316" r="3.2" fill="#fcd34d"/><text x="84" y="320" font-size="13" fill="#e2e8f0" font-weight="600">Quarantine · Milk Queue · Farm Log</text><text x="84" y="336" font-size="11" fill="#94a3b8">release · retry · read</text><g filter="url(#shadow)"><rect x="470" y="160" width="330" height="230" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="488" y="160" width="294" height="4" rx="2" fill="url(#g-emerald)"/><text x="490" y="194" font-size="17" font-weight="800" fill="#fff">CowSec server</text><text x="490" y="213" font-size="11.5" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">127.0.0.1:8090</text><circle cx="494" cy="232" r="3.2" fill="#6ee7b7"/><text x="506" y="236" font-size="13" fill="#e2e8f0" font-weight="600">Validates every field</text><text x="506" y="252" font-size="11" fill="#94a3b8">domains, addresses, quotas</text><circle cx="494" cy="270" r="3.2" fill="#6ee7b7"/><text x="506" y="274" font-size="13" fill="#e2e8f0" font-weight="600">Fixed set of operations</text><text x="506" y="290" font-size="11" fill="#94a3b8">no raw API pass-through</text><circle cx="494" cy="308" r="3.2" fill="#6ee7b7"/><text x="506" y="312" font-size="13" fill="#e2e8f0" font-weight="600">Audit log</text><text x="506" y="328" font-size="11" fill="#94a3b8">who changed what, when</text><g filter="url(#shadow)"><rect x="892" y="130" width="500" height="290" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".45"/></g><rect x="910" y="130" width="464" height="4" rx="2" fill="url(#g-sky)"/><text x="912" y="164" font-size="17" font-weight="800" fill="#fff">mailcow API</text><text x="912" y="183" font-size="11.5" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">https://127.0.0.1 · X-API-Key</text><circle cx="916" cy="202" r="3.2" fill="#7dd3fc"/><text x="928" y="206" font-size="13" fill="#e2e8f0" font-weight="600">Key stays root-only</text><text x="928" y="222" font-size="11" fill="#94a3b8">/etc/cowsec/mailcow.env</text><circle cx="916" cy="240" r="3.2" fill="#7dd3fc"/><text x="928" y="244" font-size="13" fill="#e2e8f0" font-weight="600">API_ALLOW_FROM</text><text x="928" y="260" font-size="11" fill="#94a3b8">localhost + mailcow's Docker gateway</text><circle cx="916" cy="278" r="3.2" fill="#7dd3fc"/><text x="928" y="282" font-size="13" fill="#e2e8f0" font-weight="600">Existing key reused</text><text x="928" y="298" font-size="11" fill="#94a3b8">your other tools keep working</text><rect x="912" y="306" width="67.8" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="919" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">domains</text><rect x="987.8" y="306" width="82.6" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="994.8" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">mailboxes</text><rect x="1078.4" y="306" width="67.8" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1085.4" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">aliases</text><rect x="1154.2" y="306" width="45.6" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1161.2" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">dkim</text><rect x="1207.8" y="306" width="90" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1214.8" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">quarantine</text><rect x="1305.8" y="306" width="53" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="1312.8" y="321" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">mailq</text><rect x="912" y="334" width="45.6" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="919" y="349" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">logs</text><rect x="965.6" y="334" width="60.4" height="22" rx="7" fill="#7dd3fc" fill-opacity=".12" stroke="#7dd3fc" stroke-opacity=".35"/><text x="972.6" y="349" font-size="11" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">status</text><path d="M378 275 H470" fill="none" stroke="#fcd34d" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-amber)"/><rect x="399.25" y="242" width="49.5" height="22" rx="11" fill="#050a18" stroke="#fcd34d" stroke-opacity=".5"/><text x="424" y="257" font-size="11" text-anchor="middle" fill="#fcd34d" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">HTTPS</text><path d="M800 275 H892" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-emerald)"/><rect x="827.95" y="242" width="36.1" height="22" rx="11" fill="#050a18" stroke="#6ee7b7" stroke-opacity=".5"/><text x="846" y="257" font-size="11" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">API</text><text x="48" y="450" font-size="12.5" fill="#64748b">Enable it in the setup wizard, or on an existing install: <tspan font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" fill="#a5b4fc">sudo cowsec-setup mailcow-api</tspan></text></svg>
