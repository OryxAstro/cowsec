<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="600" rx="26"/></clipPath><rect width="1440" height="600" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="60" r="270" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="270" r="252" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="612" r="240" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="600" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="598.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">DNS-01 certificates, end to end</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">No port 80: Let&apos;s Encrypt checks a TXT record in your DNS. The daily timer renews and only redeploys when something changed.</text><g filter="url(#shadow)"><rect x="48" y="130" width="250" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="66" y="130" width="214" height="4" rx="2" fill="url(#g-emerald)"/><text x="68" y="164" font-size="17" font-weight="800" fill="#fff">lego</text><text x="68" y="183" font-size="11.5" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">on your server</text><circle cx="72" cy="202" r="3.2" fill="#6ee7b7"/><text x="84" y="206" font-size="13" fill="#e2e8f0" font-weight="600">Requests a certificate</text><text x="84" y="222" font-size="11" fill="#94a3b8">per domain, with wildcards</text><circle cx="72" cy="240" r="3.2" fill="#6ee7b7"/><text x="84" y="244" font-size="13" fill="#e2e8f0" font-weight="600">Writes a TXT record</text><text x="84" y="260" font-size="11" fill="#94a3b8">via your provider's API</text><g filter="url(#shadow)"><rect x="360" y="130" width="250" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".45"/></g><rect x="378" y="130" width="214" height="4" rx="2" fill="url(#g-sky)"/><text x="380" y="164" font-size="17" font-weight="800" fill="#fff">Your DNS provider</text><text x="380" y="183" font-size="11.5" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">190+ supported</text><circle cx="384" cy="202" r="3.2" fill="#7dd3fc"/><text x="396" y="206" font-size="13" fill="#e2e8f0" font-weight="600">_acme-challenge TXT</text><text x="396" y="222" font-size="11" fill="#94a3b8">created, then removed</text><circle cx="384" cy="240" r="3.2" fill="#7dd3fc"/><text x="396" y="244" font-size="13" fill="#e2e8f0" font-weight="600">Credentials root-only</text><text x="396" y="260" font-size="11" fill="#94a3b8">/etc/cowsec/dns.env</text><g filter="url(#shadow)"><rect x="672" y="130" width="250" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#a5b4fc" stroke-opacity=".45"/></g><rect x="690" y="130" width="214" height="4" rx="2" fill="url(#g-indigo)"/><text x="692" y="164" font-size="17" font-weight="800" fill="#fff">Let's Encrypt</text><text x="692" y="183" font-size="11.5" fill="#a5b4fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">ACME</text><circle cx="696" cy="202" r="3.2" fill="#a5b4fc"/><text x="708" y="206" font-size="13" fill="#e2e8f0" font-weight="600">Checks the TXT record</text><text x="708" y="222" font-size="11" fill="#94a3b8">at authoritative servers</text><circle cx="696" cy="240" r="3.2" fill="#a5b4fc"/><text x="708" y="244" font-size="13" fill="#e2e8f0" font-weight="600">Issues the certificate</text><text x="708" y="260" font-size="11" fill="#94a3b8">90 days, renewed early</text><g filter="url(#shadow)"><rect x="984" y="130" width="408" height="200" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="1002" y="130" width="372" height="4" rx="2" fill="url(#g-amber)"/><text x="1004" y="164" font-size="17" font-weight="800" fill="#fff">Deployed to</text><text x="1004" y="183" font-size="11.5" fill="#fcd34d" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">per-hostname SNI</text><circle cx="1008" cy="202" r="3.2" fill="#fcd34d"/><text x="1020" y="206" font-size="13" fill="#e2e8f0" font-weight="600">Web: OpenResty edge</text><text x="1020" y="222" font-size="11" fill="#94a3b8">one server block per domain</text><circle cx="1008" cy="240" r="3.2" fill="#fcd34d"/><text x="1020" y="244" font-size="13" fill="#e2e8f0" font-weight="600">IMAP: dovecot SNI folders</text><text x="1020" y="260" font-size="11" fill="#94a3b8">data/assets/ssl/&lt;domain&gt;/</text><circle cx="1008" cy="278" r="3.2" fill="#fcd34d"/><text x="1020" y="282" font-size="13" fill="#e2e8f0" font-weight="600">SMTP: postfix SNI map</text><text x="1020" y="298" font-size="11" fill="#94a3b8">extra.cf · cowsec_sni.map</text><path d="M298 230 H360" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-emerald)"/><rect x="310.95" y="197" width="36.1" height="22" rx="11" fill="#050a18" stroke="#6ee7b7" stroke-opacity=".5"/><text x="329" y="212" font-size="11" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">TXT</text><path d="M610 230 H672" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-sky)"/><rect x="612.9" y="197" width="56.2" height="22" rx="11" fill="#050a18" stroke="#7dd3fc" stroke-opacity=".5"/><text x="641" y="212" font-size="11" text-anchor="middle" fill="#7dd3fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">verify</text><path d="M922 230 H984" fill="none" stroke="#a5b4fc" stroke-width="2.2" stroke-opacity=".85" marker-end="url(#m-indigo)"/><rect x="931.6" y="197" width="42.8" height="22" rx="11" fill="#050a18" stroke="#a5b4fc" stroke-opacity=".5"/><text x="953" y="212" font-size="11" text-anchor="middle" fill="#a5b4fc" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">cert</text><text x="48" y="392" font-size="18" font-weight="800" fill="#fff">Why one certificate per domain</text><g filter="url(#shadow)"><rect x="48" y="412" width="650" height="150" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fb7185" stroke-opacity=".45"/></g><rect x="66" y="412" width="614" height="4" rx="2" fill="url(#g-rose)"/><text x="68" y="446" font-size="17" font-weight="800" fill="#fff">Shared certificate</text><text x="68" y="465" font-size="11.5" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">what a visitor to mail.example.org sees</text><rect x="68" y="474" width="97.4" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="75" y="489" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">example.com</text><rect x="173.4" y="474" width="97.4" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="180.4" y="489" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">example.org</text><rect x="278.8" y="474" width="134.4" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="285.8" y="489" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">client-one.co.uk</text><rect x="421.2" y="474" width="119.6" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="428.2" y="489" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">client-two.com</text><rect x="548.8" y="474" width="90" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="555.8" y="489" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">family.net</text><rect x="68" y="502" width="112.2" height="22" rx="7" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".35"/><text x="75" y="517" font-size="11" fill="#fb7185" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">…every domain</text><g filter="url(#shadow)"><rect x="742" y="412" width="650" height="150" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="760" y="412" width="614" height="4" rx="2" fill="url(#g-emerald)"/><text x="762" y="446" font-size="17" font-weight="800" fill="#fff">One per domain (default)</text><text x="762" y="465" font-size="11.5" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" letter-spacing=".4">what a visitor to mail.example.org sees</text><rect x="762" y="474" width="97.4" height="22" rx="7" fill="#6ee7b7" fill-opacity=".12" stroke="#6ee7b7" stroke-opacity=".35"/><text x="769" y="489" font-size="11" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">example.org</text><rect x="867.4" y="474" width="112.2" height="22" rx="7" fill="#6ee7b7" fill-opacity=".12" stroke="#6ee7b7" stroke-opacity=".35"/><text x="874.4" y="489" font-size="11" fill="#6ee7b7" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">*.example.org</text><text x="1066" y="530" font-size="12.5" fill="#94a3b8" text-anchor="middle">Your other domains stay private.</text><text x="374" y="550" font-size="12.5" fill="#94a3b8" text-anchor="middle">Anyone can list everyone you host.</text></svg>
