<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" font-family="'Plus Jakarta Sans','Segoe UI',Inter,system-ui,-apple-system,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050a18"/><stop offset="1" stop-color="#0b1530"/></linearGradient><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e0f2fe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity=".8"/><stop offset=".5" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#818cf8" stop-opacity=".8"/></linearGradient><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern><linearGradient id="g-rose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#e11d48"/></linearGradient><marker id="m-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fb7185"/></marker><linearGradient id="g-indigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/></linearGradient><marker id="m-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a5b4fc"/></marker><linearGradient id="g-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><marker id="m-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7dd3fc"/></marker><linearGradient id="g-emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient><marker id="m-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6ee7b7"/></marker><linearGradient id="g-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient><marker id="m-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#fcd34d"/></marker><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><marker id="m-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c4b5fd"/></marker></defs><clipPath id="clip"><rect width="1440" height="420" rx="26"/></clipPath><rect width="1440" height="420" rx="26" fill="url(#bg)"/><g clip-path="url(#clip)"><circle cx="172" cy="42" r="189" fill="#6366f1" opacity=".35" filter="url(#blur)"/><circle cx="1324" cy="189" r="176" fill="#0ea5e9" opacity=".22" filter="url(#blur)"/><circle cx="576" cy="428" r="168" fill="#10b981" opacity=".18" filter="url(#blur)"/><rect width="1440" height="420" fill="url(#grid)"/></g><rect x=".75" y=".75" width="1438.5" height="418.5" rx="25.5" fill="none" stroke="url(#rim)" stroke-width="1.5"/><text x="48" y="64" font-size="28" font-weight="800" fill="url(#title)">Where to look first</text><text x="48" y="94" font-size="14.5" fill="#94a3b8">Most problems show up in one of these places within a minute.</text><g filter="url(#shadow)"><rect x="48" y="130" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fb7185" stroke-opacity=".45"/></g><rect x="66" y="130" width="396" height="4" rx="2" fill="url(#g-rose)"/><text x="68" y="164" font-size="17" font-weight="800" fill="#fff">Locked out?</text><text x="68" y="202" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ cscli decisions delete --ip &lt;ip&gt;</text><text x="68" y="224" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ cscli allowlists add cowsec &lt;ip&gt;</text><g filter="url(#shadow)"><rect x="504" y="130" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#fcd34d" stroke-opacity=".45"/></g><rect x="522" y="130" width="396" height="4" rx="2" fill="url(#g-amber)"/><text x="524" y="164" font-size="17" font-weight="800" fill="#fff">2FA codes rejected?</text><text x="524" y="202" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ timedatectl</text><text x="524" y="224" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ cowsec auth totp reset &lt;user&gt;</text><g filter="url(#shadow)"><rect x="960" y="130" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#a5b4fc" stroke-opacity=".45"/></g><rect x="978" y="130" width="396" height="4" rx="2" fill="url(#g-indigo)"/><text x="980" y="164" font-size="17" font-weight="800" fill="#fff">Setup or upgrade failed?</text><text x="980" y="202" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ /var/lib/cowsec/jobs/*.log</text><text x="980" y="224" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ journalctl -t cowsec-hostctl</text><g filter="url(#shadow)"><rect x="48" y="272" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#7dd3fc" stroke-opacity=".45"/></g><rect x="66" y="272" width="396" height="4" rx="2" fill="url(#g-sky)"/><text x="68" y="306" font-size="17" font-weight="800" fill="#fff">Console won't load?</text><text x="68" y="344" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ systemctl status cowsec</text><text x="68" y="366" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ journalctl -u cowsec -n 100</text><g filter="url(#shadow)"><rect x="504" y="272" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#c4b5fd" stroke-opacity=".45"/></g><rect x="522" y="272" width="396" height="4" rx="2" fill="url(#g-violet)"/><text x="524" y="306" font-size="17" font-weight="800" fill="#fff">Web or WAF problem?</text><text x="524" y="344" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ journalctl -u openresty</text><text x="524" y="366" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ openresty -t</text><g filter="url(#shadow)"><rect x="960" y="272" width="432" height="120" rx="18" fill="#0d152a" fill-opacity=".92" stroke="#6ee7b7" stroke-opacity=".45"/></g><rect x="978" y="272" width="396" height="4" rx="2" fill="url(#g-emerald)"/><text x="980" y="306" font-size="17" font-weight="800" fill="#fff">Bans not biting?</text><text x="980" y="344" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ iptables -S DOCKER-USER</text><text x="980" y="366" font-size="12.5" fill="#cbd5e1" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace">$ cscli metrics</text></svg>
